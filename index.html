<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visite 3D du Studio — 4 × 4 m</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene-canvas" aria-label="Visite virtuelle 3D du studio"></canvas>

  <div class="hud" aria-live="polite">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-pill">
        <div class="brand-title">Mon Studio</div>
        <span class="room-divider" aria-hidden="true"></span>
        <span id="room-badge" class="room-badge">Studio</span>
      </div>

      <div class="toolbar-group" role="toolbar" aria-label="Réglages de la visite">
        <div class="segmented" aria-label="Ambiance lumineuse">
          <button type="button" class="seg-btn active" data-light="day">Jour</button>
          <button type="button" class="seg-btn" data-light="golden">Fin d'après-midi</button>
          <button type="button" class="seg-btn" data-light="night">Soirée</button>
        </div>

        <button type="button" id="btn-curtains" class="pill-btn">Fermer rideaux</button>
        <button type="button" id="btn-archviz" class="pill-btn active">Rendu Studio HD</button>
        <button type="button" id="btn-snapshot" class="pill-btn">Photo PNG</button>
        <button type="button" id="btn-dimensions" class="pill-btn">Cotes 4 m &amp; prises</button>
        <button type="button" id="btn-plan" class="pill-btn active">Plan</button>
      </div>
    </header>

    <!-- Center reticle & interaction prompt -->
    <div class="reticle" aria-hidden="true"></div>
    <div id="interact-prompt" class="interact-prompt" role="status">
      <span class="key-badge">Clic / E</span>
      <span id="interact-text"></span>
    </div>

    <!-- Interactive 2D Floor Plan Minimap -->
    <aside id="minimap-card" class="minimap-card" aria-label="Plan interactif du studio">
      <div class="minimap-header">
        <span>Plan 4 × 4 m</span>
        <span class="minimap-hint">Cliquer pour s'y déplacer</span>
      </div>
      <canvas id="minimap-canvas" width="210" height="300"></canvas>
    </aside>

    <!-- Bottom Navigation Dock -->
    <footer class="bottom-bar">
      <div class="mode-row">
        <div class="segmented" aria-label="Mode de caméra">
          <button type="button" id="btn-mode-fps" class="seg-btn active">Visite libre</button>
          <button type="button" id="btn-mode-orbit" class="seg-btn">Vue maquette</button>
        </div>

        <div class="segmented zoom-controls" aria-label="Zoom de la caméra">
          <button type="button" id="btn-zoom-out" class="seg-btn zoom-step" title="Dézoomer (-)" aria-label="Dézoomer">−</button>
          <button type="button" id="btn-zoom-reset" class="seg-btn zoom-readout" title="Réinitialiser le zoom (0)" aria-label="Réinitialiser le zoom">1.0×</button>
          <button type="button" id="btn-zoom-in" class="seg-btn zoom-step" title="Zoomer (+)" aria-label="Zoomer">+</button>
        </div>

        <button type="button" id="btn-pointer-lock" class="pill-btn subtle">Visée souris libre</button>
      </div>

      <nav id="viewpoint-dock" class="viewpoint-dock" aria-label="Points de vue"></nav>

      <div class="controls-legend">
        <span><kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd> ou flèches : marcher</span>
        <span>Glisser : regarder</span>
        <span>Molette ou <kbd>+</kbd><kbd>−</kbd> : zoomer / dézoomer</span>
        <span>Double-clic au sol : aller ici</span>
      </div>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
